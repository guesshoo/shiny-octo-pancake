[package]
name = "cache-rs"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
bincode = "1.3.3"
bytes = "1"
config = "0.15.11"
flatbuffers = "25.2.10"
hex = "0.4.3"
lmdb = "0.8.0"
prost = "0.13.5"
prost-types = "0.13.5"
serde = "1.0.219"
sled = "0.34.7"
thiserror = "1"
tokio = { version = "1.45", features = ["full"] }

[build-dependencies]
prost-build = "0.13.5"


[dev-dependencies]
# only used when running tests
tempfile = "3"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "client"
path = "src/client.rs"
