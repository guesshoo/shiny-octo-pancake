syntax = "proto3";

package uc.msg;


// Top-level envelope for any request
message Envelope {
  uint32 request_id = 1;       // client-generated, for matching replies
  oneof body {
    GetRequest    get    = 10;
    PutRequest    put    = 11;
    EvictRequest  evict  = 12;
    StatsRequest  stats  = 13;
  }
}

// Responses
message EnvelopeResponse {
  uint32 request_id = 1;
  oneof body {
    GetResponse    get_response    = 20;
    PutResponse    put_response    = 21;
    EvictResponse  evict_response  = 22;
    StatsResponse  stats_response  = 23;
    ErrorResponse  error           = 24;
  }
}

message GetRequest {
  string cache_name = 1;
  bytes  key        = 2;
}

message GetResponse {
  bool   found      = 1;
  bytes  value      = 2;
}

message PutRequest {
  string cache_name = 1;
  bytes  key        = 2;
  bytes  value      = 3;
  // optional TTL or expiration can be added here later:
  // uint32 ttl_ms = 4;
}

message PutResponse {
  bool success = 1;
}

message EvictRequest {
  string cache_name = 1;
  bytes  key        = 2;
}

message EvictResponse {
  bool success = 1;
}

message StatsRequest {
  string cache_name = 1;
}

message StatsResponse {
  uint64 hits       = 1;
  uint64 misses     = 2;
  uint64 entry_count = 3;
}

message ErrorResponse {
  string message = 1;
  uint32 code    = 2;
}
